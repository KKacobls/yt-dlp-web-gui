<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <script>
      // Apply the saved theme before React renders to prevent a white flash.
      (() => {
        try {
          const saved = localStorage.getItem('ytdlp-theme');
          const dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0b1120' : '#f5f7fb');
        } catch (_) { /* Storage can be disabled in privacy mode. */ }
      })();
    </script>
    <title>yt-dlp 影片下載工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
